name: CI Docs

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run build

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v18

      - name: Link checker
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --verbose
            --no-progress
            --base-url https://cloudticon.com
            --accept 200,429
            --max-retries 3
            --retry-wait-time 2
            --timeout 20
            "./src/content/docs/**/*.md"
